<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Daily Quiz AI</title>

<link rel="shortcut icon" href="icon/english ai.png" type="image/x-icon">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,
'Segoe UI',Roboto,sans-serif;
}

body{
background:#0f1117;
color:white;
height:100vh;
display:flex;
flex-direction:column;
}



.lesson-card{
background:#181c28;
padding:25px;
border-radius:25px;
margin:20px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.lesson-card h2{
margin-bottom:15px;
font-size:24px;
font-weight:700;
}

.translation-box{
width:100%;
height:220px;
background:#252c42;
border:none;
outline:none;
color:white;
padding:20px;
border-radius:20px;
resize:none;
font-size:16px;
line-height:1.7;
margin-top:15px;
margin-bottom:15px;
}

.translation-box::placeholder{
color:#9ea7c5;
}

#checkTranslation{
width:100%;
padding:16px;
border:none;
border-radius:15px;
cursor:pointer;
font-size:16px;
font-weight:700;
background:linear-gradient(
90deg,
#4facfe,
#00f2fe
);
color:white;
transition:.3s;
margin-bottom:15px;
}

#checkTranslation:hover{
transform:translateY(-2px);
opacity:.95;
}

#translationResult{
background:#252c42;
padding:20px;
border-radius:20px;
line-height:1.8;
white-space:pre-wrap;
color:#d1d7e6;
min-height:120px;
}

.page-wrapper{
max-width:900px;
width:100%;
margin:0 auto;
padding-bottom:40px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
margin-bottom:20px;
}

.back-btn{
background:#181c28;
color:white;
border:none;
padding:12px 18px;
border-radius:12px;
cursor:pointer;
font-size:14px;
font-weight:600;
transition:.3s;
}

.back-btn:hover{
background:#252c42;
transform:translateY(-2px);
}

.logo{
font-size:24px;
font-weight:700;
background:linear-gradient(
90deg,
#4facfe,
#00f2fe
);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero{
margin:0 20px 20px;
padding:20px;
border-radius:25px;
background:
linear-gradient(
135deg,
#1b1f2e,
#252c42
);
}

.hero h2{
margin-bottom:10px;
}

.hero p{
color:#b8bfd6;
line-height:1.6;
}

.quick-prompts{
display:flex;
gap:10px;
overflow:auto;
padding:0 20px 20px;
}

.prompt{
background:#181c28;
padding:10px 15px;
border-radius:15px;
cursor:pointer;
white-space:nowrap;
}

.chat-box{
flex:1;
overflow-y:auto;
padding:20px;
}

.message{
max-width:80%;
padding:15px;
border-radius:18px;
margin-bottom:15px;
line-height:1.6;
}

.user{
background:
linear-gradient(
90deg,
#4facfe,
#00f2fe
);
margin-left:auto;
}

.ai{
background:#181c28;
}

.input-area{
display:flex;
gap:10px;
padding:15px;
background:#141824;
}

.input-area input{
flex:1;
border:none;
outline:none;
background:#181c28;
color:white;
padding:15px;
border-radius:15px;
}

.send-btn{
width:60px;
border:none;
border-radius:15px;
background:
linear-gradient(
90deg,
#4facfe,
#00f2fe
);
color:white;
cursor:pointer;
}

.clear-btn{
background:#ff4757;
color:white;
border:none;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
}

#quizCountdown{
background:#252c42;
padding:12px;
border-radius:12px;
margin-bottom:15px;
text-align:center;
font-weight:bold;
color:#4facfe;
}

.quiz-question{
font-size:20px;
font-weight:700;
margin-bottom:20px;
line-height:1.6;
}

.quiz-option{
display:block;
width:100%;
padding:15px;
margin-bottom:10px;
border:none;
border-radius:15px;
background:#252c42;
color:white;
cursor:pointer;
text-align:left;
font-size:16px;
transition:.2s;
}

.quiz-option:hover{
background:#313b5a;
}

.quiz-option.selected{
border:2px solid #4facfe;
}

#submitQuiz{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:linear-gradient(
90deg,
#4facfe,
#00f2fe
);
color:white;
font-weight:700;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

#quizResult{
margin-top:15px;
padding:20px;
border-radius:15px;
background:#252c42;
line-height:1.8;
}

</style>
</head>
<body>

    <div class="header">

        <button
        class="back-btn"
        onclick="window.location.href='../index.html'">
        Back
        </button>
        
        <div class="logo">
        Daily Quiz
        </div>
        
        <div style="width:80px;"></div>
        
        </div>

    <div class="page-wrapper">

  
        
        <div class="lesson-card">

            <h2>🧠 Daily Quiz</h2>
            
            <div id="quizCountdown">
            Next quiz in: 23:59:59
            </div>
            
            <div id="quizQuestion"
            class="quiz-question">
            Loading quiz...
            </div>
            
            <div id="quizOptions"></div>
            
            <button id="submitQuiz">
            Submit Answer
            </button>
            
            <div id="quizResult">
            Waiting...
            </div>
            
            </div>

        </div>
<script>


document
.getElementById(
"submitQuiz"
)
.onclick = ()=>{

if(!selectedAnswer){

alert(
"Pilih jawaban dulu"
);

return;

}

const correct =
selectedAnswer ===
dailyQuiz.answer;

document
.getElementById(
"quizResult"
)
.innerHTML =

correct
?

`✅ Correct

Explanation:
${dailyQuiz.explanation}`

:

`❌ Wrong

Correct Answer:
${dailyQuiz.answer}

Explanation:
${dailyQuiz.explanation}`;

};


function startQuizCountdown(){

function update(){

const now = new Date();

const tomorrow = new Date();

tomorrow.setHours(
24,0,0,0
);

const diff =
tomorrow - now;

const h =
Math.floor(diff/1000/60/60);

const m =
Math.floor(diff/1000/60)%60;

const s =
Math.floor(diff/1000)%60;

document.getElementById(
"quizCountdown"
).innerText =
`Next quiz in: ${h}:${m}:${s}`;

}

update();

setInterval(update,1000);

}

startQuizCountdown();


let dailyQuiz = null;
let selectedAnswer = "";

async function loadQuiz(){

try{

    const res = await fetch(
"https://englishai.adyajaboleh197.workers.dev/quiz/today"
);
const data = await res.json();

console.log(data);

if(data.error){

document.getElementById(
"quizQuestion"
).innerText =
"Error: " + data.error;

return;

}

dailyQuiz = data;

document.getElementById(
"quizQuestion"
).innerText =
dailyQuiz.question;

const wrap =
document.getElementById(
"quizOptions"
);

wrap.innerHTML = "";

dailyQuiz.options.forEach(option=>{

const btn =
document.createElement("button");

btn.className =
"quiz-option";

btn.innerText =
option;

btn.onclick = ()=>{

selectedAnswer = option;

document
.querySelectorAll(".quiz-option")
.forEach(x=>
x.classList.remove("selected")
);

btn.classList.add("selected");

};

wrap.appendChild(btn);

});

}catch(err){

console.error(err);

document.getElementById(
"quizQuestion"
).innerText =
"Failed to load quiz";

}

}

loadQuiz();
</script>

</body>
</html>
