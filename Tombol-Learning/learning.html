<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Daily English Lesson</title>
<link rel="shortcut icon" href="icon/english ai.png" type="image/x-icon">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}

body{
background:#0f1117;
color:white;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.back-btn{
background:#181c28;
color:white;
border:none;
padding:10px 16px;
border-radius:12px;
cursor:pointer;
}

.logo{
font-size:28px;
font-weight:700;
background:linear-gradient(90deg,#4facfe,#00f2fe);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.lesson-card{
background:#181c28;
padding:25px;
border-radius:25px;
margin-bottom:20px;
}

.lesson-card h2{
margin-bottom:15px;
}

.lesson-card p{
line-height:1.8;
color:#d1d7e6;
}

.vocab-item{
padding:15px;
background:#252c42;
border-radius:15px;
margin-bottom:10px;
}

.grammar-box{
background:#252c42;
padding:15px;
border-radius:15px;
line-height:1.7;
}

.question{
background:#252c42;
padding:15px;
border-radius:15px;
margin-bottom:10px;
}

.nav-btns{
display:flex;
gap:15px;
margin-top:20px;
}

.nav-btns button{
flex:1;
padding:15px;
border:none;
border-radius:15px;
background:linear-gradient(90deg,#4facfe,#00f2fe);
color:white;
font-weight:600;
cursor:pointer;
}

.chapter-card{
background:#ffffff;
color:#222;
border-radius:25px;
padding:30px;
margin-bottom:25px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
position:relative;
}

.chapter-card h2{
font-size:32px;
font-weight:700;
margin-bottom:15px;
}

.chapter-card p{
font-size:18px;
line-height:1.8;
color:#555;
min-height:140px;
}

.page-number{
position:absolute;
right:30px;
bottom:95px;
font-size:28px;
font-weight:700;
color:#999;
}

.chapter-nav{
display:flex;
justify-content:space-between;
align-items:center;
border-top:1px solid #2e2c2c;
padding-top:20px;
margin-top:30px;
}

.chapter-nav button{
border:none;
padding:12px 22px;
border-radius:12px;
cursor:pointer;
font-weight:600;
background:#0c0c0c;
color:white;
}

.chapter-nav button:hover{
opacity:.9;
}

.dots{
display:flex;
gap:10px;
}

.dot{
width:42px;
height:42px;
border-radius:50%;
border:none;
background:#e5e7eb;
color:#222;
font-weight:700;
cursor:pointer;
}

.dot.active{
background:#0d6efd;
color:white;
}

.translation-box{
width:100%;
height:220px;
background:#252c42;
border:none;
outline:none;
color:white;
padding:20px;
border-radius:20px;
resize:none;
font-size:16px;
margin-top:15px;
margin-bottom:15px;
}

#checkTranslation{
width:100%;
padding:15px;
border:none;
border-radius:15px;
cursor:pointer;
font-size:16px;
font-weight:700;
background: black;
color:rgb(253, 250, 250);
margin-bottom:15px;
}

#translationResult{
background:#252c42;
padding:20px;
border-radius:15px;
line-height:1.8;
white-space:pre-wrap;
}

.quiz-item{
background:#252c42;
padding:18px;
border-radius:15px;
margin-bottom:12px;
line-height:1.7;
}

.quiz-item b{
color:#4facfe;
}

</style>
</head>
<body>

<div class="header">
<button class="back-btn"
onclick="window.location.href='../index.html'">
Back
</button>

<div class="logo">
Daily Lesson
</div>
</div>

<div class="chapter-card">

    <h2 id="chapterTitle">
    Bab 1: Perkenalan
    </h2>
    
    <p id="chapterPreview">
    Cerita singkat untuk belajar bahasa Inggris.
    </p>
    
    <div class="page-number"
    id="pageNumber">
    1
    </div>
    
    <div class="chapter-nav">
    
    <button id="prevBtn">
    Sebelumnya
    </button>
    
    <div class="dots">
    <button class="dot">1</button>
    <button class="dot">2</button>
    <button class="dot">3</button>
    <button class="dot">4</button>
    </div>
    
    <button id="nextBtn">
    Selanjutnya
    </button>
    
    </div>
    </div>

    <div class="lesson-card">
        📖 Daily Story
        </div>
    <div class="lesson-card">

        <h2>
        ✍ Translate To English
        </h2>
        
        <textarea
        id="translationInput"
        class="translation-box"
        placeholder="Tulis terjemahan bahasa Inggris..."
        ></textarea>
        
        <button id="checkTranslation">
        Check Translation
        </button>
        
        <div id="translationResult">
        Waiting...
        </div>
        
        </div>

        <div class="lesson-card">

            <h2>
            🧠 Daily Quiz
            </h2>
            
            <div id="quizArea"></div>
            
            </div>


<script>

const lessons = [

{
title:"Bab 1: Perkenalan",

story:`
Nama saya Andi.
Saya seorang pelajar.
Saya belajar bahasa Inggris setiap hari.
`,

quiz:[
"Siapa nama tokoh cerita?",
"Apa pekerjaan Andi?",
"Apa yang dipelajari Andi?"
]
},

{
title:"Bab 2: Di Sekolah",

story:`
Hari ini Andi pergi ke sekolah.
Dia bertemu guru bahasa Inggris.
Mereka belajar bersama.
`,

quiz:[
"Andi pergi ke mana?",
"Siapa yang ditemui?",
"Apa yang mereka lakukan?"
]
}

];

let current =
parseInt(localStorage.getItem("lessonIndex")) || 0;

function loadLesson(){

document.getElementById("storyText")
.innerHTML =
lessons[current].story;

localStorage.setItem(
"lessonIndex",
current
);

}

document
.getElementById("nextLesson")
.onclick = () => {

current++;

if(current >= lessons.length){
current = 0;
}

loadLesson();

};

document
.getElementById("prevLesson")
.onclick = () => {

current--;

if(current < 0){
current = lessons.length-1;
}

loadLesson();

};

loadLesson();

function loadQuiz(){

const area =
document.getElementById(
"quizArea"
);

area.innerHTML = "";

lessons[current]
.quiz
.forEach((q,i)=>{

area.innerHTML += `
<div class="question">
${i+1}. ${q}
</div>
`;

});

}

document
.getElementById(
"checkTranslation"
)
.onclick = async ()=>{

const text =
document
.getElementById(
"translationInput"
)
.value;

const story =
lessons[current].story;

const res =
await fetch(
WORKER_URL,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

mode:"translation",

story:story,

message:text

})
}
);

const data =
await res.json();

document
.getElementById(
"translationResult"
)
.innerHTML =
data.reply;

};

</script>

</body>
</html>
