<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Roleplay Chat</title>
<link rel="shortcut icon" href="icon/english ai.png" type="image/x-icon">
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#0f1117;
color:white;
height:100vh;
display:flex;
flex-direction:column;
}

.control-bar{
    display:flex;
    gap:12px;
    margin-left:auto;
}

#startBtn,
#stopBtn{
    min-width:160px;
    height:50px;
    padding:0 24px;
    border:none;
    border-radius:10px; /* lebih kotak */
    cursor:pointer;
    font-size:15px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:all .25s ease;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
}

/* START */
#startBtn{
    background:linear-gradient(
        135deg,
        #22c55e,
        #16a34a
    );
    color:white;
}

#startBtn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(34,197,94,.35);
}

/* STOP */
#stopBtn{
    background:linear-gradient(
        135deg,
        #ef4444,
        #dc2626
    );
    color:white;
}

#stopBtn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(239,68,68,.35);
}

#startBtn:active,
#stopBtn:active{
    transform:scale(.97);
}

.header{
    background:#181c28;
    padding:15px 20px;
    display:flex;
    align-items:center;
    gap:15px;
}

.control-bar{
    margin-left:auto;
    display:flex;
    gap:12px;
}

.back-btn{
background:#252c42;
border:none;
color:white;
padding:10px 15px;
border-radius:12px;
cursor:pointer;
}

.role-title{
font-size:20px;
font-weight:bold;
}

.chat-container{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:12px;
}

.message{
padding:14px 16px;
border-radius:18px;
max-width:80%;
line-height:1.5;
word-wrap:break-word;
}

.user{
background:linear-gradient(90deg,#4facfe,#00f2fe);
align-self:flex-end;
}

.ai{
background:#252c42;
align-self:flex-start;
}

.input-area{
display:flex;
gap:10px;
padding:15px;
background:#181c28;
}

.input-area input{
flex:1;
padding:15px;
border:none;
outline:none;
border-radius:15px;
background:#252c42;
color:white;
}

.send-btn{
width:60px;
border:none;
border-radius:15px;
background:linear-gradient(135deg,#4facfe,#00f2fe);
color:white;
font-size:20px;
cursor:pointer;
}

</style>
</head>
<body>

<div class="header">

<button class="back-btn"
onclick="window.location.href='roleplay.html'">
Back
</button>

<div>
<div class="role-title" id="scenarioName">
Roleplay
</div>
</div>

<div class="control-bar">

    <button id="startBtn">
    ▶ Start Roleplay
    </button>
    
    <button id="stopBtn">
    ⏹ Stop
    </button>
    
    </div>

</div>



<div id="chatContainer"
class="chat-container">
</div>

<div class="input-area">

<input
type="text"
id="userInput"
placeholder="Type your message..."
>

<button
class="send-btn"
id="sendBtn">
➤
</button>

</div>

<script>

// ======================
// WORKER URL
// ======================

const WORKER_URL =
"https://englishai.adyajaboleh197.workers.dev";

// ======================
// DATA ROLEPLAY
// ======================

const scenario =
localStorage.getItem("roleplayScenario") ||
"Roleplay";

const prompt =
localStorage.getItem("roleplayPrompt") ||
"You are an English teacher.";

// tampilkan nama skenario

document.getElementById(
"scenarioName"
).innerText = scenario;

const chatContainer =
document.getElementById(
"chatContainer"
);

const userInput =
document.getElementById(
"userInput"
);

const sendBtn =
document.getElementById(
"sendBtn"
);

// ======================
// PESAN AWAL
// ======================

addMessage(
"ai",
`✅ ${scenario} mode started.

Let's begin.
`
);

// ======================
// EVENT
// ======================

sendBtn.onclick =
sendMessage;

userInput.addEventListener(
"keypress",
e=>{
if(e.key==="Enter"){
sendMessage();
}
}
);

// ======================
// CHAT
// ======================

async function sendMessage(){

const text =
userInput.value.trim();

if(!text) return;

userInput.value="";

addMessage(
"user",
text
);

const loading =
document.createElement("div");

loading.className =
"message ai";

loading.innerText =
"Typing...";

chatContainer.appendChild(
loading
);

chatContainer.scrollTop =
chatContainer.scrollHeight;

try{

const res =
await fetch(
WORKER_URL,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

message:text,

mode:"roleplay",

scenario:scenario,

prompt:prompt

})
}
);

const data =
await res.json();

loading.remove();

addMessage(
"ai",
data.reply ||
"No response"
);

}catch(err){

console.error(err);

loading.remove();

addMessage(
"ai",
"Server Error"
);

}

}

const startBtn =
document.getElementById("startBtn");

startBtn.onclick = async ()=>{

chatContainer.innerHTML = "";

addMessage(
"ai",
"⏳ Starting roleplay..."
);

try{

const res =
await fetch(
WORKER_URL,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

mode:"roleplay",
action:"start",

scenario:
localStorage.getItem(
"roleplayScenario"
)

})
}
);

const data =
await res.json();

chatContainer.innerHTML = "";

addMessage(
"ai",
data.reply
);

}catch(err){

console.error(err);

chatContainer.innerHTML = "";

addMessage(
"ai",
"❌ Failed to start roleplay"
);

}

};

// stop 
const stopBtn =
document.getElementById("stopBtn");

stopBtn.onclick = ()=>{

addMessage(
"ai",
"✅ Roleplay ended."
);

};

// ======================
// TAMPILKAN PESAN
// ======================

function addMessage(
role,
text
){

const div =
document.createElement(
"div"
);

div.className =
`message ${role}`;

div.innerHTML =
text;

chatContainer.appendChild(
div
);

chatContainer.scrollTop =
chatContainer.scrollHeight;

}

</script>

</body>
</html>
