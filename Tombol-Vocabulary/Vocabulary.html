<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English AI Vocabulary</title>

<link rel="shortcut icon" href="icon/english ai.png" type="image/x-icon">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}

body{
    background:#0f1117;
    color:white;
    min-height:100vh;
    padding:20px;
}
.container{
    width:100%;
    min-height:100vh;
    padding:20px;
    padding-bottom:220px;
    display:block;
}

/* ✅ TAMBAHAN: Halaman Roleplay */


.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.logo{
    font-size:28px;
    font-weight:700;
    background:linear-gradient(90deg,#4facfe,#00f2fe);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* ✅ DIUBAH: Latar putih bulat pas, TANPA garis biru */
.profile{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#ffffff;
    padding:4px;
    object-fit:contain;
    border:none;
}

.back-btn{
    background:rgba(255,255,255,0.1);
    border:none;
    color:white;
    padding:8px 15px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:5px;
}

.hero{
    background:linear-gradient(135deg,#1b1f2e,#252c42);
    border-radius:30px;
    padding:30px;
    margin-bottom:30px;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
}

.hero::before{
    content:'';
    position:absolute;
    width:200px;
    height:200px;
    background:rgba(79,172,254,0.15);
    border-radius:50%;
    top:-80px;
    right:-80px;
}

.hero h1{
    font-size:34px;
    margin-bottom:15px;
    line-height:1.2;
}

.hero p{
    color:#b8bfd6;
    line-height:1.7;
    margin-bottom:25px;
}

.start-btn{
    background:linear-gradient(90deg,#4facfe,#00f2fe);
    border:none;
    color:white;
    padding:14px 28px;
    border-radius:15px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.start-btn:hover{
    transform:scale(1.05);
}

.section-title{
    font-size:24px;
    font-weight:600;
    margin-bottom:20px;
}

.feature-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:18px;
    margin-bottom:35px;
}

.feature-card{
    background:#181c28;
    border-radius:25px;
    padding:22px;
    transition:0.3s;
    border:1px solid rgba(255,255,255,0.04);
    cursor:pointer;
}

.feature-card:hover{
    transform:translateY(-5px);
    background:#1f2433;
}

.filter-box{
margin-bottom:20px;
display:flex;
justify-content:left;

}

#difficultySelect{
background:#181c28;
color:white;
border:none;
padding:12px 18px;
border-radius:12px;
font-size:15px;
}

.icon{
    width:60px;
    height:60px;
    border-radius:18px;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    margin-bottom:18px;
}
.vocab-card{
    background:#181c28;
    border-radius:25px;
    padding:30px;
    text-align:center;
    margin-bottom:25px;
}

.level-badge{
    display:inline-block;
    background:#4facfe;
    padding:8px 14px;
    border-radius:20px;
    margin-bottom:15px;
    font-size:13px;
}

.vocab-card h2{
    font-size:40px;
    margin-bottom:20px;
}

.meaning-btn{
    background:linear-gradient(90deg,#4facfe,#00f2fe);
    border:none;
    color:white;
    padding:12px 20px;
    border-radius:12px;
    cursor:pointer;
}

#meaningArea{
    margin-top:25px;
    text-align:left;
}

#meaningArea h3{
    margin-top:15px;
    margin-bottom:5px;
    color:#4facfe;
}

.action-buttons{
    display:flex;
    gap:15px;
    margin-bottom:25px;
}

.action-buttons button{
    flex:1;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#181c28;
    color:white;
    cursor:pointer;
}

.progress-card{
    background:#181c28;
    border-radius:20px;
    padding:20px;
}

.progress-bar{
    height:12px;
    background:#2c3448;
    border-radius:20px;
    overflow:hidden;
    margin:15px 0;
}

.progress-fill{
    height:100%;
    width:10%;
    background:linear-gradient(90deg,#4facfe,#00f2fe);
}

</style>
</head>
<body>
    <div class="container">

        <div class="header">
            <button class="back-btn" onclick="window.location.href='../index.html'">
                Back
                </button>

               
    
            <div class="logo">
                Vocabulary
            </div>
    
            <img src="../icon/english ai.png" class="profile">
        </div>
    
        <div class="hero">
            <h1>📚 Vocabulary Builder</h1>
            <p>
                Learn new English words every day and improve your vocabulary.
            </p>
        </div>

        <div class="filter-box">

            <select id="difficultySelect">
            
            <option value="All">
            All Levels
            </option>
            
            <option value="Beginner">
            Beginner
            </option>
            
            <option value="Intermediate">
            Intermediate
            </option>
            
            <option value="Advanced">
            Advanced
            </option>
            
            </select>
            
            </div>
    
        <div class="vocab-card">
    
            <div class="level-badge" id="wordLevel">
                Beginner
            </div>
    
            <h2 id="englishWord">
                Enthusiastic
            </h2>
    
            <button id="showMeaningBtn" class="meaning-btn">
                Show Meaning
            </button>

            <button
id="listenBtn"
class="meaning-btn"
style="margin-top:10px;">
🔊 Listen
</button>
    
            <div id="meaningArea" style="display:none;">
                <h3>Meaning</h3>
                <p id="indoMeaning">
                    Antusias
                </p>
    
                <h3>Pronunciation</h3>
                <p id="pronunciation">
                    /ɪnˌθuːziˈæstɪk/
                </p>
    
                <h3>Example</h3>
                <p id="exampleSentence">
                    She is enthusiastic about learning English.
                </p>
            </div>
    
        </div>
    
        <div class="action-buttons">
            <button id="prevBtn">⬅ Previous</button>
            <button id="nextBtn">Next ➜</button>
        </div>
    
        <div class="progress-card">
            <h3>Progress</h3>
    
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
    
            <span id="progressText">1 / 10 Words</span>
        </div>
    
    </div>




<script>



let current = 0;

function speakWord(){

  const utter =
  new SpeechSynthesisUtterance(
    filteredWords[current].word
  );

  utter.lang = "en-US";

  speechSynthesis.speak(utter);

}

listenBtn.onclick = speakWord;

let selectedLevel =
localStorage.getItem("vocabLevel")
|| "Beginner";

difficultySelect.value =
selectedLevel;

const words = [

{
word:"Enthusiastic",
meaning:"Antusias",
pronunciation:"En-thoo-zee-as-tik",
example:"She is enthusiastic about learning English.",
level:"Beginner"
},

{
word:"Journey",
meaning:"Perjalanan",
pronunciation:"Jur-ni",
example:"My journey started last year.",
level:"Beginner"
},

{
word:"Achievement",
meaning:"Pencapaian",
pronunciation:"A-cheev-ment",
example:"Passing the test was a great achievement.",
level:"Intermediate"
},

{
word:"Determination",
meaning:"Tekad",
pronunciation:"Di-ter-mi-nei-shen",
example:"Determination helps people succeed.",
level:"Intermediate"
},

{
word:"Extraordinary",
meaning:"Luar biasa",
pronunciation:"Eks-tra-or-di-ne-ri",
example:"She has extraordinary talent.",
level:"Advanced"
}

];

let filteredWords = [];

function filterWords(){

  if(selectedLevel === "All"){

    filteredWords = words;

  }else{

    filteredWords =
    words.filter(
      w => w.level === selectedLevel
    );

  }

  current = 0;

  loadWord();

}

function loadWord(){

  const w =
  filteredWords[current];

  englishWord.textContent =
  w.word;

  indoMeaning.textContent =
  w.meaning;

  pronunciation.textContent =
  w.pronunciation;

  exampleSentence.textContent =
  w.example;

  wordLevel.textContent =
  w.level;

  meaningArea.style.display =
  "none";

  progressFill.style.width =
  ((current+1) /
  filteredWords.length) * 100 + "%";

  progressText.textContent =
  `${current+1} / ${filteredWords.length} Words`;

}

difficultySelect.onchange = () => {

  selectedLevel =
  difficultySelect.value;

  localStorage.setItem(
    "vocabLevel",
    selectedLevel
  );

  filterWords();

};

showMeaningBtn.onclick = () => {

  meaningArea.style.display =
  "block";

};




filterWords();
async function loadTodayWord(){

try{

  const res = await fetch(
    "https://englishai.adyajaboleh197.workers.dev/vocabulary/today"
  );

  const data = await res.json();

  let wordData;

  if(data.response){
    wordData = JSON.parse(data.response);
  }else{
    wordData = data;
  }

  englishWord.textContent =
    wordData.word;

  indoMeaning.textContent =
    wordData.meaning;

  pronunciation.textContent =
    wordData.pronunciation;

  exampleSentence.textContent =
    wordData.example;

  wordLevel.textContent =
    wordData.level;

}
catch(err){

  console.error(err);

}

}



</script>

</body>
</html>
