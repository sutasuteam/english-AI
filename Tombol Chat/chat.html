<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>AI Chat</title>

<link rel="shortcut icon" href="icon/english ai.png" type="image/x-icon">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,
'Segoe UI',Roboto,sans-serif;
}

body{
background:#0f1117;
color:white;
height:100vh;
display:flex;
flex-direction:column;
}

.header{
display:flex;
align-items:center;
justify-content:space-between;
padding:20px;
}

.back-btn{
background:#181c28;
color:white;
border:none;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
}

.logo{
font-size:24px;
font-weight:700;
background:linear-gradient(
90deg,
#4facfe,
#00f2fe
);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero{
margin:0 20px 20px;
padding:20px;
border-radius:25px;
background:
linear-gradient(
135deg,
#1b1f2e,
#252c42
);
}

.hero h2{
margin-bottom:10px;
}

.hero p{
color:#b8bfd6;
line-height:1.6;
}

.quick-prompts{
display:flex;
gap:10px;
overflow:auto;
padding:0 20px 20px;
}

.prompt{
background:#181c28;
padding:10px 15px;
border-radius:15px;
cursor:pointer;
white-space:nowrap;
}

.chat-box{
flex:1;
overflow-y:auto;
padding:20px;
}

.message{
max-width:80%;
padding:15px;
border-radius:18px;
margin-bottom:15px;
line-height:1.6;
}

.user{
background:
linear-gradient(
90deg,
#4facfe,
#00f2fe
);
margin-left:auto;
}

.ai{
background:#181c28;
}

.input-area{
display:flex;
gap:10px;
padding:15px;
background:#141824;
}

.input-area input{
flex:1;
border:none;
outline:none;
background:#181c28;
color:white;
padding:15px;
border-radius:15px;
}

.send-btn{
width:60px;
border:none;
border-radius:15px;
background:
linear-gradient(
90deg,
#4facfe,
#00f2fe
);
color:white;
cursor:pointer;
}

.clear-btn{
background:#ff4757;
color:white;
border:none;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
}

</style>
</head>
<body>

<div class="header">

<button class="back-btn"
onclick="location.href='../index.html'">
Back
</button>

<div class="logo">
AI Chat
</div>

<button class="clear-btn"
id="clearBtn">
Clear
</button>

</div>

<div class="hero">

<h2>🤖 AI English Chat</h2>

<p>
Talk naturally with AI and improve
your English daily.
</p>

</div>

<div class="quick-prompts">

<div class="prompt">
Correct my grammar
</div>

<div class="prompt">
Teach me vocabulary
</div>

<div class="prompt">
Let's practice conversation
</div>

<div class="prompt">
Translate Indonesian to English
</div>

</div>

<div id="chatBox"
class="chat-box">

<div class="message ai">
Hello 👋<br>
I'm your English AI Teacher.
How can I help you today?
</div>

</div>

<div class="input-area">

<input
id="userInput"
placeholder="Type your English...">

<button
id="sendBtn"
class="send-btn">
➤
</button>

</div>

<script>

    // 🔥 SESSION ID (WAJIB TARUH DI AWAL)
    if (!localStorage.getItem("chat_session_id")) {

localStorage.setItem(
  "chat_session_id",
  crypto.randomUUID()
);

}

const WORKER_URL =
"https://englishai.adyajaboleh197.workers.dev";

const chatBox =
document.getElementById("chatBox");

const input =
document.getElementById("userInput");

const sendBtn =
document.getElementById("sendBtn");

const clearBtn =
document.getElementById("clearBtn");


// ======================
// LOAD HISTORY
// ======================

chatBox.innerHTML =
localStorage.getItem("chatHistory")
||
chatBox.innerHTML;


// ======================
// SAVE CHAT
// ======================

function saveChat(){

localStorage.setItem(
"chatHistory",
chatBox.innerHTML
);

}


// ======================
// ADD MESSAGE
// ======================

function addMessage(
text,
type
){

const div =
document.createElement("div");

div.className =
`message ${type}`;

div.innerHTML = text;

chatBox.appendChild(div);

chatBox.scrollTop =
chatBox.scrollHeight;

saveChat();

}


// ======================
// SEND MESSAGE
// ======================

async function sendMessage(){

const msg =
input.value.trim();

if(!msg) return;

input.value = "";

addMessage(
msg,
"user"
);

const loading =
document.createElement("div");

loading.className =
"message ai";

loading.innerHTML =
"Typing...";

setTimeout(() => {
    if (loading) {
        loading.innerHTML = "No response from AI...";
    }
}, 10000);

chatBox.appendChild(
loading
);

try{


  const sessionId =
localStorage.getItem("chat_session_id");

const res = await fetch(
WORKER_URL,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message: msg,
session_id: sessionId,
mode: "chat"
})
}
);



const data =
await res.json();

loading.remove();

addMessage(
data.reply,
"ai"
);

}catch(err){

loading.remove();

addMessage(
"Server Error",
"ai"
);

}

}

sendBtn.onclick =
sendMessage;

input.addEventListener(
"keypress",
e=>{
if(e.key==="Enter")
sendMessage();
}
);


// ======================
// QUICK PROMPTS
// ======================

document
.querySelectorAll(".prompt")
.forEach(btn=>{

btn.onclick = ()=>{

input.value =
btn.innerText;

};

});


// ======================
// CLEAR CHAT
// ======================

clearBtn.onclick = ()=>{

localStorage.removeItem(
"chatHistory"
);

chatBox.innerHTML = `
<div class="message ai">
Hello 👋<br>
I'm your English AI Teacher.
</div>
`;

};

</script>

</body>
</html>
