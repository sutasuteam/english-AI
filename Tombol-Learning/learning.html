let currentPage = 0;

function renderPage(){

document.getElementById("pageContent").innerHTML = `

<h1 class="page-title">
${pages[currentPage].title}
</h1>

${pages[currentPage].content}

`;

renderDots();

}

function renderDots(){

const wrap =
document.getElementById("pageDots");

wrap.innerHTML = "";

const start =
Math.max(0,currentPage-4);

const end =
Math.min(
pages.length,
start+9
);

for(let i=start;i<end;i++){

const btn =
document.createElement("button");

btn.className =
"page-dot";

if(i===currentPage)
btn.classList.add("active");

btn.innerText = i+1;

btn.onclick = ()=>{

currentPage=i;
renderPage();

};

wrap.appendChild(btn);

}

}

document
.getElementById("nextPage")
.onclick=()=>{

if(currentPage<pages.length-1){

currentPage++;
renderPage();

}

};

document
.getElementById("prevPage")
.onclick=()=>{

if(currentPage>0){

currentPage--;
renderPage();

}

};

renderPage();
