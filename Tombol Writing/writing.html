<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English AI Vocabulary</title>

<link rel="shortcut icon" href="icon/english ai.png" type="image/x-icon">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}

body{
    background:#0f1117;
    color:white;
    min-height:100vh;
    padding:20px;
}

.feedback-title{
margin-top:25px;
margin-bottom:12px;
color:#4facfe;
font-size:18px;
font-weight:600;
}

.footer{
margin-top:40px;
padding:25px;
text-align:center;
color:#8c95b2;
font-size:14px;
border-top:1px solid rgba(255,255,255,0.08);
}

.footer p{
line-height:1.8;
}

.container{
    width:100%;
    min-height:100vh;
    padding:20px;
    padding-bottom:220px;
    display:block;
}


.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.logo{
    font-size:28px;
    font-weight:700;
    background:linear-gradient(90deg,#4facfe,#00f2fe);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* ✅ TAMBAHAN: Halaman Roleplay */


.topic-card{
background:#181c28;
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

.topic-card h3{
margin-bottom:10px;
color:#4facfe;
}

.writing-box{
width:100%;
height:220px;
background:#181c28;
border:none;
outline:none;
color:white;
padding:20px;
border-radius:20px;
resize:none;
font-size:16px;
margin-bottom:20px;
}

.check-btn{
width:100%;
padding:16px;
border:none;
border-radius:15px;
background:linear-gradient(
90deg,
#4facfe,
#00f2fe
);
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
}

.result-area{
margin-top:20px;
background:#181c28;
padding:20px;
border-radius:20px;
line-height:1.8;
white-space:pre-wrap;
}
/* ✅ DIUBAH: Latar putih bulat pas, TANPA garis biru */
.profile{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#ffffff;
    padding:4px;
    object-fit:contain;
    border:none;
}

.back-btn{
    background:rgba(255,255,255,0.1);
    border:none;
    color:white;
    padding:8px 15px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:5px;
}

.hero{
    background:linear-gradient(135deg,#1b1f2e,#252c42);
    border-radius:30px;
    padding:30px;
    margin-bottom:30px;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
}

.hero::before{
    content:'';
    position:absolute;
    width:200px;
    height:200px;
    background:rgba(79,172,254,0.15);
    border-radius:50%;
    top:-80px;
    right:-80px;
}

.hero h1{
    font-size:34px;
    margin-bottom:15px;
    line-height:1.2;
}

.hero p{
    color:#b8bfd6;
    line-height:1.7;
    margin-bottom:25px;
}

.start-btn{
    background:linear-gradient(90deg,#4facfe,#00f2fe);
    border:none;
    color:white;
    padding:14px 28px;
    border-radius:15px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.start-btn:hover{
    transform:scale(1.05);
}

.section-title{
    font-size:24px;
    font-weight:600;
    margin-bottom:20px;
}

.feature-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:18px;
    margin-bottom:35px;
}

.feature-card{
    background:#181c28;
    border-radius:25px;
    padding:22px;
    transition:0.3s;
    border:1px solid rgba(255,255,255,0.04);
    cursor:pointer;
}

.feature-card:hover{
    transform:translateY(-5px);
    background:#1f2433;
}

.icon{
    width:60px;
    height:60px;
    border-radius:18px;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    margin-bottom:18px;
}

</style>
</head>
<body>
    <div class="container">

        <div class="header">
        
        <button class="back-btn"
        onclick="history.back()">
        Back
        </button>
        
        <div class="logo">
        Writing Practice
        </div>
        
        </div>
        
        <div class="hero">
        <h1>✍️ Improve Your Writing</h1>
        <p>
        Write in English and get corrections from AI.
        </p>
        </div>
        
        <div class="topic-card">

            <h3>Today's Topic</h3>
        
            <p id="topicText">
                Loading...
            </p>
        
            <br>
        
            <p style="color:#4facfe;">
                Next Topic In:
                <span id="countdown">00:00:00</span>
            </p>
        
        </div>
        
        <textarea
        id="writingInput"
        class="writing-box"
        placeholder="Write your English paragraph here...">
        </textarea>
        
        <button
        id="checkBtn"
        class="check-btn">
        Check Writing
        </button>
        
        <h3 class="feedback-title">
        🤖 AI Feedback
        </h3>
        
        <div
        id="resultArea"
        class="result-area">
        Waiting for your writing...
        </div>
        
        </div>
        <script>

            const WORKER_URL =
            "https://englishai.adyajaboleh197.workers.dev?v=" + Date.now();
            
            const topicText =
            document.getElementById("topicText");
            
            const checkBtn =
            document.getElementById("checkBtn");
            
            const writingInput =
            document.getElementById("writingInput");
            
            const resultArea =
            document.getElementById("resultArea");
            
            
            // ======================
            // SESSION KHUSUS WRITING
            // ======================
            
            let sessionId =
            localStorage.getItem("writing_session");
            
            if(!sessionId){
            
                sessionId =
                crypto.randomUUID();
            
                localStorage.setItem(
                    "writing_session",
                    sessionId
                );
            
            }
            
            
            // ======================
            // LOAD DAILY TOPIC
            // ======================
            
            async function loadDailyTopic(){

const topicText =
document.getElementById("topicText");

const now =
Date.now();

const savedTopic =
localStorage.getItem("dailyTopic");

const expireTime =
Number(
localStorage.getItem("topicExpire")
);

if(
savedTopic &&
expireTime &&
now < expireTime
){

topicText.textContent =
savedTopic;

startCountdown(expireTime);

return;

}

try{

const res =
await fetch(
WORKER_URL.replace(/\?.*/,"")
+ "/writing/topic"
);

const data =
await res.json();

topicText.textContent =
data.topic;

const nextExpire =
now + (24 * 60 * 60 * 1000);

localStorage.setItem(
"dailyTopic",
data.topic
);

localStorage.setItem(
"topicExpire",
nextExpire
);

startCountdown(nextExpire);

}catch(err){

console.error(err);

topicText.textContent =
"Describe your favorite hobby.";

}

}

//countdown

function startCountdown(expireTime){

const countdown =
document.getElementById("countdown");

function update(){

const diff =
expireTime - Date.now();

if(diff <= 0){

countdown.textContent =
"00:00:00";

localStorage.removeItem(
"dailyTopic"
);

localStorage.removeItem(
"topicExpire"
);

location.reload();

return;

}

const hours =
Math.floor(
diff / 1000 / 60 / 60
);

const minutes =
Math.floor(
(diff / 1000 / 60) % 60
);

const seconds =
Math.floor(
(diff / 1000) % 60
);

countdown.textContent =
`${String(hours).padStart(2,"0")}:${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

}

update();

setInterval(update,1000);

}

            
            
            // ======================
            // SAVE DRAFT
            // ======================
            
            writingInput.value =
            localStorage.getItem("writingDraft")
            || "";
            
            writingInput.addEventListener(
            "input",
            ()=>{
            
            localStorage.setItem(
            "writingDraft",
            writingInput.value
            );
            
            }
            );
            
            
            // ======================
            // CHECK WRITING
            // ======================
            
            checkBtn.onclick = async ()=>{
            
            const text =
            writingInput.value.trim();
            
            if(!text){
            
            alert(
            "Please write something first."
            );
            
            return;
            
            }
            
            resultArea.innerHTML =
            "⚡ Checking...";
            
            try{
            
            const res =
            await fetch(
            WORKER_URL,
            {
            method:"POST",
            headers:{
            "Content-Type":"application/json"
            },
            body:JSON.stringify({
            
            message:text,
            
            mode:"writing",
            
            session_id:sessionId
            
            })
            }
            );
            
            const data =
            await res.json();
            
            console.log(
            "WRITING RESPONSE:",
            data
            );
            
            if(data.error){
            
            resultArea.innerHTML =
            "❌ " + data.error;
            
            return;
            
            }
            
            resultArea.innerHTML =
            data.reply ||
            "No feedback received.";
            
            }catch(err){
            
            console.error(err);
            
            resultArea.innerHTML =
            "❌ Server Error";
            
            }
            
            };
            
            
            // ======================
            // INIT
            // ======================
            
            window.onload = ()=>{
            
            loadDailyTopic();
            
            };
            
            </script>

<footer class="footer">
    <p>
        English AI Learning • Practice Every Day 🚀
    </p>
</footer>

</body>
</html>
