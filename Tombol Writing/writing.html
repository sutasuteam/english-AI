<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English AI Vocabulary</title>

<link rel="shortcut icon" href="icon/english ai.png" type="image/x-icon">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}

body{
    background:#0f1117;
    color:white;
    min-height:100vh;
    padding:20px;
}
.container{
    width:100%;
    min-height:100vh;
    padding:20px;
    padding-bottom:220px;
    display:block;
}


.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.logo{
    font-size:28px;
    font-weight:700;
    background:linear-gradient(90deg,#4facfe,#00f2fe);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* ✅ TAMBAHAN: Halaman Roleplay */


.topic-card{
background:#181c28;
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

.topic-card h3{
margin-bottom:10px;
color:#4facfe;
}

.writing-box{
width:100%;
height:220px;
background:#181c28;
border:none;
outline:none;
color:white;
padding:20px;
border-radius:20px;
resize:none;
font-size:16px;
margin-bottom:20px;
}

.check-btn{
width:100%;
padding:16px;
border:none;
border-radius:15px;
background:linear-gradient(
90deg,
#4facfe,
#00f2fe
);
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
}

.result-area{
margin-top:20px;
background:#181c28;
padding:20px;
border-radius:20px;
line-height:1.8;
white-space:pre-wrap;
}
/* ✅ DIUBAH: Latar putih bulat pas, TANPA garis biru */
.profile{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#ffffff;
    padding:4px;
    object-fit:contain;
    border:none;
}

.back-btn{
    background:rgba(255,255,255,0.1);
    border:none;
    color:white;
    padding:8px 15px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:5px;
}

.hero{
    background:linear-gradient(135deg,#1b1f2e,#252c42);
    border-radius:30px;
    padding:30px;
    margin-bottom:30px;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
}

.hero::before{
    content:'';
    position:absolute;
    width:200px;
    height:200px;
    background:rgba(79,172,254,0.15);
    border-radius:50%;
    top:-80px;
    right:-80px;
}

.hero h1{
    font-size:34px;
    margin-bottom:15px;
    line-height:1.2;
}

.hero p{
    color:#b8bfd6;
    line-height:1.7;
    margin-bottom:25px;
}

.start-btn{
    background:linear-gradient(90deg,#4facfe,#00f2fe);
    border:none;
    color:white;
    padding:14px 28px;
    border-radius:15px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.start-btn:hover{
    transform:scale(1.05);
}

.section-title{
    font-size:24px;
    font-weight:600;
    margin-bottom:20px;
}

.feature-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:18px;
    margin-bottom:35px;
}

.feature-card{
    background:#181c28;
    border-radius:25px;
    padding:22px;
    transition:0.3s;
    border:1px solid rgba(255,255,255,0.04);
    cursor:pointer;
}

.feature-card:hover{
    transform:translateY(-5px);
    background:#1f2433;
}

.icon{
    width:60px;
    height:60px;
    border-radius:18px;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    margin-bottom:18px;
}

</style>
</head>
<body>
    <div class="container">

        <div class="header">
        
        <button class="back-btn"
        onclick="history.back()">
        ⬅ Back
        </button>
        
        <div class="logo">
        Writing Practice
        </div>
        
        </div>
        
        <div class="hero">
        <h1>✍️ Improve Your Writing</h1>
        <p>
        Write in English and get corrections from AI.
        </p>
        </div>
        
        <div class="topic-card">
        
        <h3>Today's Topic</h3>
        
        <p id="topicText">
        Describe your favorite hobby.
        </p>
        
        </div>
        
        <textarea
        id="writingInput"
        class="writing-box"
        placeholder="Write your English paragraph here...">
        </textarea>
        
        <button
        id="checkBtn"
        class="check-btn">
        Check Writing
        </button>
        
        <div
        id="resultArea"
        class="result-area">
        </div>
        
        </div>

<script>


const WORKER_URL =
"https://englishai.adyajaboleh197.workers.dev";

const checkBtn =
document.getElementById("checkBtn");

const writingInput =
document.getElementById("writingInput");

const resultArea =
document.getElementById("resultArea");

checkBtn.onclick =
async () => {

const text =
writingInput.value.trim();

if(!text) return;

resultArea.innerHTML =
"⚡ Checking...";

try{

const res =
await fetch(
WORKER_URL,
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
message:
`Check this English writing:

${text}

Give:

1. Corrected version
2. Grammar mistakes
3. Suggestions
4. Score out of 10`
})
}
);

const data =
await res.json();

resultArea.innerHTML =
data.reply;

}catch{

resultArea.innerHTML =
"Server Error";

}

};



</script>

</body>
</html>
